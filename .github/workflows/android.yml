# THE APK IS BUILT HERE RATHER THAN ON A DESKTOP, and that was not a
# preference. On the machine this was written on, every JVM fails
# `Selector.open()` with "Unable to establish loopback connection", in both
# shells and with the sandbox off. Gradle needs a selector to reach its own
# daemon, so no Android build can run there at all.
#
# It also answers the question a local build cannot: the APK a person installs
# is built from a commit, by a recipe anybody can read, with a key nobody has
# to email.
name: Android

# EVERY PUSH TO MAIN REBUILDS IT. Their instruction, 21 September 2026:
# "when pushing future updates, can you make sure the android build also gets
# updated with them?"
#
# THE CONTENT WAS NEVER THE REASON. The app shows the live site in its own
# window, so an edit to app.js or styles.css reaches the phone the moment
# Vercel deploys, with no new APK. What a new APK carries is the window
# itself: sign-in, shares, saving, the updater and the version in Settings.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # THE KEY COMES FROM A SECRET AND LEAVES NO TRACE IN THE REPOSITORY.
      # One key for every build, or an upgrade installs as a different app.
      - name: Restore the signing key
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/yeetlist.keystore

      # THE APP CHECKS FOR A NEWER APK ON EVERY LAUNCH and hands it to the
      # system installer. Their instruction: prompt, then install, because
      # Android has no silent path off Play. The updater's Java is written by
      # one tool, which proves its own clauses first.
      - name: Add the updater
        run: |
          node tools/android-updater.mjs --self-test
          node tools/android-updater.mjs android

      # THE VERSION IS THE WEB BUILD STAMP. app.js is the one writer, the
      # header paints it, and Settings shows the same string. The code is that
      # stamp as an integer, YYMMDD * 100 + N, and a code that never rises is
      # an app that refuses to install over itself.
      - name: Build
        working-directory: android
        env:
          YEET_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          NAME=$(node ../tools/app-version.mjs --name ..)
          CODE=$(node ../tools/app-version.mjs --code ..)
          echo "version $NAME, code $CODE"
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease \
            -PyeetVersionName="$NAME" -PyeetVersionCode="$CODE"

      # BOTH FINGERPRINTS ARE PRINTED ON EVERY RUN. Google Cloud's Android
      # sign-in entry needs the SHA-1, and the site's assetlinks.json names the
      # SHA-256. A mismatch in either is silent until somebody signs in.
      - name: Print the signing fingerprints
        run: |
          keytool -list -v -keystore android/yeetlist.keystore -alias yeetlist \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" | grep -iE "SHA1:|SHA256:"

      # THE FILE A READER DOWNLOADS CARRIES ITS OWN NAME AND VERSION, and a
      # release build that came out unsigned stops the run here. An unsigned
      # APK installs over nothing.
      - name: Name the build
        id: name
        run: |
          STAMP=$(node tools/app-version.mjs --name)
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -f "$APK" || { echo "no signed APK at $APK"; ls -R android/app/build/outputs; exit 1; }
          mv "$APK" "android/yeetlist-$STAMP.apk"
          mv "$AAB" "android/yeetlist-$STAMP.aab"
          ls -l android/yeetlist-$STAMP.*

      - uses: actions/upload-artifact@v4
        with:
          name: yeetlist-apk
          path: |
            android/yeetlist-${{ steps.name.outputs.stamp }}.apk
            android/yeetlist-${{ steps.name.outputs.stamp }}.aab

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.name.outputs.stamp }}
          name: Yeetlist ${{ steps.name.outputs.stamp }}
          files: |
            android/yeetlist-${{ steps.name.outputs.stamp }}.apk
            android/yeetlist-${{ steps.name.outputs.stamp }}.aab
          body: |
            Install `yeetlist-${{ steps.name.outputs.stamp }}.apk` on the phone. Android asks once
            for permission to install from this source.

            **You only have to do this once.** From here the app checks this
            page on every launch, downloads a newer APK when it finds one and
            hands it to Android's installer, which asks you to confirm.
            Android has no silent install outside the Play Store.

            The app shows the live site in its own window, so everything
            inside it is already current. A new APK is only needed when the
            window itself changes: sign-in, shares, saving, the updater or
            this version.

            The `.aab` is the Play Store format.
