plugins {
    id 'com.android.application'
}

// THE VERSION IS THE WEB BUILD STAMP, handed in by CI. app.js is the one
// writer for it, the header paints it, and Settings shows the same string.
// The code is that stamp as an integer, YYMMDD * 100 + N, from
// tools/app-version.mjs, so a code that never rises cannot be built.
def stampName = project.findProperty('yeetVersionName') ?: 'dev'
def stampCode = (project.findProperty('yeetVersionCode') ?: '1') as Integer

// THE KEY COMES FROM A SECRET AND LEAVES NO TRACE IN THE REPOSITORY. One key
// for every build, or an upgrade installs as a different app. With no
// password in the environment the release build is simply unsigned, so a
// local compile still works.
def storeSecret = System.getenv('YEET_KEYSTORE_PASSWORD')
def keyFile = rootProject.file('yeetlist.keystore')

android {
    compileSdk 36
    // THE SAME PACKAGE AS THE OLD APP, so this installs over it rather than
    // beside it. Android only allows that when the signing key matches too,
    // and it does: the key is the same secret.
    namespace 'app.yeetlist.twa'

    defaultConfig {
        applicationId 'app.yeetlist.twa'
        minSdk 24
        targetSdk 36
        versionCode stampCode
        versionName stampName
    }

    signingConfigs {
        release {
            if (storeSecret && keyFile.exists()) {
                storeFile keyFile
                storePassword storeSecret
                keyAlias 'yeetlist'
                keyPassword storeSecret
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (storeSecret && keyFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    // ANDROID'S OWN GOOGLE ACCOUNT PICKER. Google refuses to show its sign-in
    // page inside an app's web view, so sign-in happens here instead. The
    // account comes from the phone, and the server gets a one-time code to
    // turn into the same lasting link the website makes.
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
}
