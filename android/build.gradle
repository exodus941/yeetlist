// THE APP DRAWS THE LIVE SITE ITSELF, WITH NO BROWSER APP BETWEEN.
//
// Their decision, 24 September 2026: route A. The old build handed the page
// to whatever browser the phone had, which is why "Running in Brave" showed,
// and why that browser's stored data held the Google link. This project uses
// the web engine that ships inside Android instead, so the page, its storage
// and its cookie belong to the app alone.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
